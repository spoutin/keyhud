name: Build & Release KeyHUD

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build:
    name: Build, Sign & Release
    runs-on: macos-14
    permissions:
      contents: write
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      HAS_NOTARY: ${{ secrets.NOTARY_API_KEY_BASE64 }}
      HAS_TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Release Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="1.0.0-${GITHUB_SHA:0:7}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version is $VERSION"

      - name: Setup Temporary Build Keychain
        if: env.HAS_APPLE_CERT != ''
        env:
          KEYCHAIN_PASSWORD_INPUT: ${{ secrets.KEYCHAIN_PASSWORD }}
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          BUILD_KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD_INPUT:-temporary-build-password-123}"
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

          # Create ephemeral keychain
          security create-keychain -p "$BUILD_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$BUILD_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import p12 certificate
          P12_PATH=$RUNNER_TEMP/certificate.p12
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$P12_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$P12_PATH"

          # Allow codesign without UI prompts
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$BUILD_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Build KeyHUD Application & DMG
        env:
          OUTPUT_DIR: build/KeyHUD.app
          PACKAGE_DMG: "true"
          PACKAGE_ZIP: "true"
          DMG_PATH: "KeyHUD-${{ env.VERSION }}.dmg"
          ZIP_PATH: "KeyHUD-${{ env.VERSION }}.zip"
          CODESIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_NAME }}
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Notarize and Staple (Apple Notary Service)
        if: env.HAS_NOTARY != ''
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
        run: |
          P8_PATH="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          echo "$NOTARY_API_KEY_BASE64" | base64 --decode > "$P8_PATH"

          echo "==> Submitting DMG to Apple Notary Service..."
          xcrun notarytool submit "KeyHUD-${{ env.VERSION }}.dmg" \
            --key "$P8_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait

          echo "==> Stapling notarization ticket to DMG..."
          xcrun stapler staple "KeyHUD-${{ env.VERSION }}.dmg"

          echo "==> Submitting ZIP to Apple Notary Service..."
          xcrun notarytool submit "KeyHUD-${{ env.VERSION }}.zip" \
            --key "$P8_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait

          rm -f "$P8_PATH"

      - name: Compute Checksums
        run: |
          shasum -a 256 KeyHUD-${{ env.VERSION }}.dmg > KeyHUD-${{ env.VERSION }}.dmg.sha256
          shasum -a 256 KeyHUD-${{ env.VERSION }}.zip > KeyHUD-${{ env.VERSION }}.zip.sha256
          cat KeyHUD-${{ env.VERSION }}.dmg.sha256
          cat KeyHUD-${{ env.VERSION }}.zip.sha256

      - name: Clean Up Keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "KeyHUD v${{ env.VERSION }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            KeyHUD-${{ env.VERSION }}.dmg
            KeyHUD-${{ env.VERSION }}.dmg.sha256
            KeyHUD-${{ env.VERSION }}.zip
            KeyHUD-${{ env.VERSION }}.zip.sha256

      - name: Update Homebrew Tap Formula
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && env.HAS_TAP_TOKEN != ''
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          SHA256=$(cat KeyHUD-${{ env.VERSION }}.dmg.sha256 | awk '{print $1}')
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone https://x-access-token:${TAP_TOKEN}@github.com/spoutin/homebrew-tap.git /tmp/homebrew-tap
          cd /tmp/homebrew-tap
          mkdir -p Casks

          cat << 'EOF' | sed 's/^[ ]\{10\}//' > Casks/keyhud.rb
          cask "keyhud" do
            version "__VERSION__"
            sha256 "__SHA256__"

            url "https://github.com/spoutin/keyhud/releases/download/v#{version}/KeyHUD-#{version}.dmg"
            name "KeyHUD"
            desc "Instant floating shortcut cheatsheet & hotkey HUD for macOS, Ghostty, and CLI/TUI tools"
            homepage "https://github.com/spoutin/keyhud"

            auto_updates true
            depends_on macos: ">= :sonoma"

            app "KeyHUD.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-cr", "#{appdir}/KeyHUD.app"]
            end

            zap trash: [
              "~/.config/keyhud",
              "~/Library/Preferences/com.ablack.KeyHUD.plist",
            ]
          end
          EOF

          sed -i '' "s/__VERSION__/${{ env.VERSION }}/g" Casks/keyhud.rb
          sed -i '' "s/__SHA256__/${SHA256}/g" Casks/keyhud.rb

          git add Casks/keyhud.rb
          git commit -m "chore(cask): update keyhud to v${{ env.VERSION }}" || true
          git push origin main
